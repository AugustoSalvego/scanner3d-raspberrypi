name: Calibration geometry tests

on:
  push:
    branches: [chatgpt-version]
  workflow_dispatch:

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless pytest flask
      - name: Validate Python syntax
        run: |
          python -m compileall -q scanner_core web_interface tests
      - name: Validate dashboard JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("web_interface/templates/index.html").read_text()
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, re.S)
          assert scripts, "No dashboard script found"
          Path("/tmp/scanner-dashboard.js").write_text(scripts[0])
          PY
          node --check /tmp/scanner-dashboard.js
      - name: Test calibration geometry and Flask API
        run: |
          python -m pytest tests/test_calibration_geometry.py tests/test_calibration_api.py tests/test_real_reconstruction.py -q
