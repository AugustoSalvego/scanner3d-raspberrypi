name: Calibration geometry tests

on:
  push:
    branches: [chatgpt-version, final-polish]
  workflow_dispatch:

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless pytest flask
      - name: Validate Python syntax
        run: |
          python -m compileall -q scanner_core web_interface tests
      - name: Validate dashboard assets
        run: |
          node --check web_interface/static/dashboard.js
          node --test tests/test_dashboard_search.cjs
          python - <<'PY'
          from pathlib import Path
          html = Path("web_interface/templates/index.html").read_text()
          assert "dashboard.js" in html and "dashboard.css" in html
          assert Path("web_interface/static/dashboard.css").is_file()
          PY
      - name: Test calibration geometry and Flask API
        run: |
          python -m pytest tests/test_calibration_geometry.py tests/test_calibration_api.py tests/test_calibration_motor_flow.py tests/test_real_reconstruction.py tests/test_session_management.py tests/test_scan_lifecycle.py tests/test_dashboard_api.py tests/test_calibration_profiles.py -q
